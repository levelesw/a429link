name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: gcc-13
      CXX: g++-13

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

      - name: Check C++ formatting
        run: |
          git ls-files -z -- '*.hpp' '*.cc' |
            xargs -0 -r clang-format-18 \
              --style=Google --dry-run --Werror

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBUILD_GMOCK=OFF
          -DA429LINK_WARNINGS_AS_ERRORS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure --no-tests=error

      - name: Configure consumer
        run: >
          cmake -S tests/consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON

      - name: Build consumer
        run: cmake --build build-consumer --parallel 2

      - name: Run consumer
        run: ./build-consumer/a429link_consumer

  clang-ubsan:
    name: clang-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang-18
      CXX: clang++-18
      CXXFLAGS: >-
        -stdlib=libc++
        -fsanitize=undefined,float-cast-overflow
        -fno-sanitize-recover=all
      LDFLAGS: >-
        -stdlib=libc++
        -fsanitize=undefined,float-cast-overflow

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and libc++
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libc++-18-dev libc++abi-18-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DBUILD_GMOCK=OFF
          -DA429LINK_WARNINGS_AS_ERRORS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure --no-tests=error